server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Przeglądarka woła API pod własnym originem (VITE_API_URL, domyślnie :8000)
    # ze ścieżką /api/... FastAPI rejestruje trasy właśnie pod /api.
    # Tego prefiksu nie wolno odcinać. Nginx nie robi proxy /api, żeby dev i Docker
    # używały tej samej, pełnej ścieżki.
}
